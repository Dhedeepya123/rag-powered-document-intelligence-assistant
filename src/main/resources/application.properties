spring.application.name=document-assistant

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:55432/ragdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:raguser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ragpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${SERVER_PORT:8081}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

spring.ai.vectorstore.pgvector.initialize-schema=${SPRING_AI_VECTORSTORE_PGVECTOR_INITIALIZE_SCHEMA:true}
spring.ai.vectorstore.pgvector.index-type=${SPRING_AI_VECTORSTORE_PGVECTOR_INDEX_TYPE:HNSW}
spring.ai.vectorstore.pgvector.distance-type=${SPRING_AI_VECTORSTORE_PGVECTOR_DISTANCE_TYPE:COSINE_DISTANCE}
spring.ai.vectorstore.pgvector.dimensions=${SPRING_AI_VECTORSTORE_PGVECTOR_DIMENSIONS:768}

spring.ai.ollama.base-url=${SPRING_AI_OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.embedding.options.model=${SPRING_AI_OLLAMA_EMBEDDING_OPTIONS_MODEL:nomic-embed-text}

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}